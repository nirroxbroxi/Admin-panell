<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nirrox Games Admin - Annonces Discord</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#6366f1',
              600: '#4f46e5',
              950: '#09090b',
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #09090b;
      background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
    }
    .glass-card {
      background: rgba(18, 18, 22, 0.85);
      backdrop-filter: blur(16px);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 text-slate-100">

  <div class="w-full max-w-lg space-y-6">
    
    <!-- En-tête -->
    <div class="text-center space-y-2">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 to-indigo-400 flex items-center justify-center font-black text-white text-2xl mx-auto shadow-lg shadow-indigo-500/30">
        <i class="fa-brands fa-discord"></i>
      </div>
      <h1 class="text-2xl font-black text-white">Nirrox Games Admin</h1>
      <p class="text-xs text-slate-400">Panneau de Contrôle & Bot d'Annonces Discord</p>
    </div>

    <!-- 1. Écran de Connexion Admin -->
    <div id="login-box" class="glass-card rounded-3xl p-6 border border-white/10 shadow-2xl space-y-5">
      <div class="space-y-1">
        <h2 class="font-bold text-lg text-white">Connexion Sécurisée</h2>
        <p class="text-xs text-slate-400">Entre ton mot de passe administrateur.</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Mot de passe</label>
          <input type="password" id="admin-pass" class="w-full bg-black/60 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="••••••••">
        </div>

        <button onclick="seConnecterAdmin()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-xs uppercase tracking-wider rounded-xl transition shadow-lg shadow-indigo-600/30">
          Se connecter
        </button>

        <p id="error-msg" class="text-xs text-red-400 font-bold text-center hidden">Mot de passe incorrect !</p>
      </div>
    </div>

    <!-- 2. Écran Panneau Admin & Annonces -->
    <div id="dashboard-box" class="glass-card rounded-3xl p-6 border border-white/10 shadow-2xl space-y-6 hidden">
      
      <div class="flex items-center justify-between border-b border-white/10 pb-4">
        <div class="flex items-center gap-2 text-emerald-400 text-xs font-bold">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span> Panel Connecté
        </div>
        <button onclick="seDeconnecter()" class="text-xs text-slate-400 hover:text-white transition">
          Déconnexion
        </button>
      </div>

      <!-- Section Configuration du Webhook Discord -->
      <div class="space-y-2 bg-indigo-950/30 p-4 rounded-2xl border border-indigo-500/20">
        <h3 class="font-bold text-xs text-indigo-300 flex items-center gap-2">
          <i class="fa-brands fa-discord text-indigo-400 text-sm"></i> Lien du Webhook Discord
        </h3>
        <div>
          <input type="password" id="discord-webhook-url" class="w-full bg-black/60 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500 font-mono placeholder:text-slate-600" placeholder="https://discord.com/api/webhooks/...">
          <span class="text-[10px] text-slate-400 mt-1.5 block">
            <i class="fa-solid fa-circle-info text-indigo-400"></i> Colle ton lien de Webhook ici. Il sera sauvegardé automatiquement sur ton navigateur !
          </span>
        </div>
      </div>

      <hr class="border-white/10">

      <!-- Modèles d'Annonces Pré-faites -->
      <div class="space-y-3">
        <label class="block text-xs font-bold text-slate-300">Modèles d'annonces rapides</label>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="chargerModele('nouveauJeu')" class="p-2.5 bg-black/40 hover:bg-indigo-950/60 border border-white/10 rounded-xl text-xs font-bold text-slate-300 text-left transition flex items-center gap-2">
            <i class="fa-solid fa-gamepad text-indigo-400"></i> 🎮 Nouveau Jeu
          </button>
          <button onclick="chargerModele('maj')" class="p-2.5 bg-black/40 hover:bg-indigo-950/60 border border-white/10 rounded-xl text-xs font-bold text-slate-300 text-left transition flex items-center gap-2">
            <i class="fa-solid fa-code-branch text-emerald-400"></i> 🚀 Mise à jour
          </button>
          <button onclick="chargerModele('maintenance')" class="p-2.5 bg-black/40 hover:bg-indigo-950/60 border border-white/10 rounded-xl text-xs font-bold text-slate-300 text-left transition flex items-center gap-2">
            <i class="fa-solid fa-wrench text-amber-400"></i> 🛠️ Maintenance
          </button>
          <button onclick="chargerModele('event')" class="p-2.5 bg-black/40 hover:bg-indigo-950/60 border border-white/10 rounded-xl text-xs font-bold text-slate-300 text-left transition flex items-center gap-2">
            <i class="fa-solid fa-triangle-exclamation text-red-400"></i> 🚨 Gros Bug
          </button>
        </div>
      </div>

      <!-- Formulaire d'Édition de l'Annonce -->
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Titre de l'Annonce</label>
          <input type="text" id="announce-title" class="w-full bg-black/60 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500" placeholder="Titre de l'annonce...">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Description / Message</label>
          <textarea id="announce-desc" rows="3" class="w-full bg-black/60 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500 resize-none" placeholder="Écris ton annonce ici..."></textarea>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">Couleur du Bot</label>
            <input type="color" id="announce-color" value="#6366f1" class="w-full h-9 bg-black/60 border border-white/10 rounded-xl p-1 cursor-pointer">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">Lien du Site (Optionnel)</label>
            <input type="text" id="announce-url" value="https://nirroxbroxi.github.io/Nirrox-Games-official/" class="w-full bg-black/60 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
          </div>
        </div>

        <button onclick="envoyerAnnonceDiscord()" id="btn-send-discord" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-xs uppercase tracking-wider rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30">
          <i class="fa-brands fa-discord"></i> Publier l'annonce sur Discord
        </button>
      </div>

      <!-- Statut de l'envoi -->
      <div id="status-box" class="hidden p-3 rounded-xl text-xs text-center font-bold"></div>

    </div>

  </div>

  <script src="admin.js"></script>
</body>
</html>
